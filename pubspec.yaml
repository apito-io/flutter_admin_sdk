name: flutter_admin_sdk
description: REST and GraphQL admin SDK for Flutter apps that talk to an Apito backend, including queries, auth, files, and schema codegen.
version: 0.6.13
publish_to: none
homepage: https://apito.io
repository: https://github.com/apito-io/flutter_admin_sdk
issue_tracker: https://github.com/apito-io/flutter_admin_sdk/issues
documentation: https://apito.io/docs
topics:
  - backend
  - graphql
  - rest
  - api
  - saas

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  meta: ^1.9.0
  json_annotation: ^4.9.0
  path: ^1.9.0

dev_dependencies:
  build: ^2.4.0
  build_config: ^1.1.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  test: ^1.24.0

# Codegen: configure flutter_admin_sdk|apito_generator in your app build.yaml only.
